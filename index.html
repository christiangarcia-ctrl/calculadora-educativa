<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ascender Intelligent Tools</title><script src="ascender-session.js"></script><style>:root{--bg:#041321;--card:#0b2237;--line:rgba(106,201,255,.2);--text:#f4f9ff;--muted:#9fb6c9;--cyan:#2ec7ff;--blue:#1d6fe8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -15%,#174d79 0%,transparent 42%),linear-gradient(180deg,#041321,#020914 85%);color:var(--text)}body{display:grid;place-items:center;padding:24px}.shell{width:min(840px,100%);background:linear-gradient(180deg,rgba(11,34,55,.94),rgba(5,18,31,.98));border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.34);padding:34px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6fd4ff;margin-bottom:10px}.title{font-size:clamp(38px,7vw,66px);line-height:1;letter-spacing:-.045em;margin:0 0 12px}.title strong{display:block;color:#56caff}.lead{color:#bad0e1;line-height:1.6;max-width:700px;margin-bottom:28px}.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8fb4ce;margin-bottom:6px;font-weight:800}.fi{width:100%;height:46px;border-radius:11px;border:1px solid rgba(145,203,239,.25);background:#071827;color:#fff;padding:0 12px;outline:none}.fi:focus{border-color:#42c7ff;box-shadow:0 0 0 3px rgba(46,199,255,.1)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:12px;padding:13px 17px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#1d6fe8,#29c4ff);color:#fff}.secondary{background:transparent;color:#d7efff;border:1px solid var(--line)}.saved{display:none;margin-top:14px;font-size:12px;color:#9edfbf}.saved.show{display:block}.existing{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:none}.existing.show{display:block}.existing p{font-size:12px;color:var(--muted)}@media(max-width:680px){.grid{grid-template-columns:1fr}.shell{padding:24px 18px}}</style></head><body><main class="shell"><div class="eyebrow">Plataforma comercial Ascender</div><h1 class="title">Ascender <strong>Intelligent Tools</strong></h1><p class="lead">Identifícate como asesor para personalizar la sesión. Esta primera versión no crea cuentas ni contraseñas: los datos se guardan únicamente en este navegador.</p><section class="card"><div class="grid"><div class="fg"><label>Nombre del asesor</label><input id="advisorName" class="fi" autocomplete="name" placeholder="Nombre y apellido"></div><div class="fg"><label>Teléfono / WhatsApp</label><input id="advisorPhone" class="fi" inputmode="tel" placeholder="10 dígitos"></div></div><div class="actions"><button id="start" class="btn primary">Entrar a las herramientas →</button><button id="proposal" class="btn secondary">Generar propuesta</button></div><div id="saved" class="saved">Datos del asesor guardados en este dispositivo.</div><div id="existing" class="existing"><p id="existingText"></p></div></section></main><script>const $=id=>document.getElementById(id);const advisor=AscenderSession.getAdvisor();if(advisor){$('advisorName').value=advisor.name||'';$('advisorPhone').value=advisor.phone||'';$('saved').classList.add('show')}const calc=AscenderSession.getCalculation();if(calc){$('existing').classList.add('show');$('existingText').textContent='Hay un cálculo guardado de '+(calc.clientName||calc.nombre||calc.childName||'la última asesoría')+'. Puedes continuar a la propuesta.'}function saveAdvisor(){const name=$('advisorName').value.trim(),phone=$('advisorPhone').value.trim();if(!name){alert('Captura el nombre del asesor.');return null}return AscenderSession.saveAdvisor({name,phone})}$('start').onclick=()=>{if(saveAdvisor())location.href='home.html'};$('proposal').onclick=()=>{if(saveAdvisor())location.href='proposal.html'};</script></body></html>
