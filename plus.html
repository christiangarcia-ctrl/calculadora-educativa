<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptiMaxx Plus · Ascender</title><style>
:root{--bg:#041321;--line:rgba(94,192,248,.24);--cyan:#39c8ff;--text:#f4f9ff;--muted:#9fb6c9}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020912;color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 14px;background:#061726;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:13px}.nav{display:flex;align-items:center;gap:7px}.btn{border:1px solid var(--line);background:#0a2236;color:#dff5ff;border-radius:10px;padding:8px 11px;font:inherit;font-size:12px;font-weight:750;cursor:pointer}.stage{position:relative;display:grid;place-items:center;min-height:0;padding:10px}.panel{display:none;width:100%;height:100%;place-items:center}.panel.on{display:grid}.slide-frame{position:relative;width:min(100%,calc((100vh - 82px)*1.778));aspect-ratio:640/360;overflow:hidden;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.38)}.sprite{position:absolute;inset:0 auto auto 0;width:100%;height:auto;max-width:none;will-change:transform}.calc{width:100%;height:100%;background:#fff}.calc iframe{width:100%;height:100%;border:0}.counter{font-size:11px;color:#a8c4d8;min-width:112px;text-align:center}.note{position:absolute;left:16px;bottom:14px;z-index:4;background:rgba(4,19,33,.88);border:1px solid var(--line);color:#b9d7ea;border-radius:10px;padding:8px 11px;font-size:11px}@media(max-width:760px){.brand{display:none}.top{justify-content:center}.btn{padding:8px 9px;font-size:11px}.note{display:none}.stage{padding:4px}}
</style></head><body><div class="app"><header class="top"><div class="brand">Ascender Intelligent Tools · OptiMaxx Plus</div><div class="nav"><button class="btn" id="prev">← Anterior</button><span class="counter" id="counter"></span><button class="btn" id="next">Siguiente →</button><button class="btn" onclick="location.href='home.html'">Inicio</button></div></header><main class="stage"><section class="panel on" id="slides"><div class="slide-frame"><img id="sprite" class="sprite" src="assets/local-slides/plus-sprite.webp" alt="Presentación original OptiMaxx Plus"></div><div class="note">Presentación original alojada en Ascender · sin Canva</div></section><section class="panel" id="calc"><div class="calc"><iframe src="https://christiangarcia-ctrl.github.io/Simulador-Ascender/mobile.html" title="Simulador Ascender"></iframe></div></section></main></div><script>
const TOTAL=14,SLIDES=13;let pos=0;const sprite=document.getElementById('sprite'),slides=document.getElementById('slides'),calc=document.getElementById('calc'),counter=document.getElementById('counter');function render(){const inCalc=pos===10;calc.classList.toggle('on',inCalc);slides.classList.toggle('on',!inCalc);if(!inCalc){const idx=pos<10?pos:pos-1;sprite.style.transform=`translateY(-${idx*(100/SLIDES)}%)`;counter.textContent=`Diapositiva ${idx+1} de 13`;}else counter.textContent='Simulador';document.getElementById('prev').disabled=pos===0;document.getElementById('next').disabled=pos===TOTAL-1}document.getElementById('prev').onclick=()=>{if(pos>0){pos--;render()}};document.getElementById('next').onclick=()=>{if(pos<TOTAL-1){pos++;render()}};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click()});render();
</script></body></html>
