t;margin-top:10pt!important;padding-top:8pt!important;font-size:6.8pt!important}.report-disclaimer{max-width:none!important;text-align:left!important;margin-top:8pt!important}}`;d.head.appendChild(style)}catch(e){console.warn('No se pudo aplicar el modo PDF móvil al iframe',e)}});
